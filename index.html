<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="T-Rex Run">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>T-Rex Run!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#nameBox {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,20,0.92);
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 10;
  touch-action: auto;
}
#nameBox .card {
  background: #0a0a2e;
  border: 2px solid #ffd700;
  padding: 28px 32px;
  text-align: center;
  font-family: monospace;
}
#nameBox h2 { color: #ffd700; font-size: 20px; margin-bottom: 6px; }
#nameBox p  { color: #aaa; font-size: 12px; margin-bottom: 18px; }
#nameInput {
  font-size: 18px; padding: 10px; width: 180px; text-align: center;
  background: #000; color: #fff; border: 2px solid #ffd700;
  font-family: monospace; display: block; margin: 0 auto 16px;
  touch-action: auto;
  -webkit-user-select: text; user-select: text;
}
#nameBtn {
  font-size: 14px; padding: 10px 28px;
  background: #ffd700; color: #000;
  border: none; font-family: monospace; font-weight: bold;
  cursor: pointer; touch-action: auto;
}

/* On-screen controls (touch devices only; see PAD in game.js) */
#pad { display: none; }
body.pad #pad { display: flex; }
body.portrait { flex-direction: column; justify-content: flex-start; }
body.portrait canvas { margin: auto 0; }
body.portrait #pad {
  flex: none; height: min(46vh, 340px); width: 100%; align-items: stretch; gap: 12px;
  padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
}
body.landscape #pad {
  position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
  justify-content: space-between; align-items: flex-end;
  padding: 0 calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
}
/* JUMP under the right thumb, BITE + RAWR under the left. */
#pad { flex-direction: row-reverse; }
#pad .right { display: flex; gap: 12px; }
body.portrait #pad .right { flex: 1.2; flex-direction: column; }
.pb {
  font-family: monospace; font-weight: bold; color: #fff; letter-spacing: 1px;
  border: 3px solid rgba(255,255,255,0.85); border-radius: 18px;
  touch-action: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: auto; box-shadow: 0 4px 0 rgba(0,0,0,0.45);
  transition: transform 0.05s, filter 0.1s;
}
body.landscape .pb small { display: none; }
/* ChatGPT's pixel icons (assets/ui), drawn crisp; the text label stays under them. */
.pb img { image-rendering: pixelated; pointer-events: none; width: 48px; height: 48px; margin-bottom: 4px; }
body.landscape .pb img { width: 32px; height: 32px; margin-bottom: 0; }
.pb small { font-size: 10px; opacity: 0.8; font-weight: normal; margin-top: 2px; }
.pb.down { transform: translateY(3px) scale(0.97); box-shadow: 0 1px 0 rgba(0,0,0,0.45); filter: brightness(1.25); }
.pb.cool { filter: grayscale(0.8) brightness(0.6); }
.jump { background: #2f8de0; }
.bite { background: #e0442f; }
.rawr { background: #e08a1a; }
.rawr.big { background: #ffcf2a; color: #402000; }
.pb.pulse { animation: pulse 0.5s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.9); } to { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255,255,255,0); opacity: 1; } }
body.portrait .pb { font-size: 22px; flex: 1; }
body.portrait .jump { flex: 1; font-size: 26px; }
body.landscape .pb { opacity: 0.72; font-size: 15px; width: 17vmin; height: 17vmin; min-width: 64px; min-height: 64px; }
body.landscape .jump { width: 22vmin; height: 22vmin; min-width: 80px; min-height: 80px; font-size: 18px; }

/* Title screen: Cat's approved artwork (assets/ui/title-screen.png), shown as-is over
   the canvas at its full resolution. Taps fall through to the canvas (see TITLE_HIT). */
#title { display: none; position: fixed; pointer-events: none; z-index: 2; }
body.title #title { display: block; }
body.title #pad { display: none; }
#title img { display: block; width: 100%; height: 100%; }
#title.px img { image-rendering: pixelated; image-rendering: crisp-edges; }
#titleMute { display: none; position: absolute; }
#title.muted #titleMute { display: block; }
#titleMute::before, #titleMute::after {
  content: ''; position: absolute; left: 50%; top: 10%; width: 12%; height: 80%; margin-left: -6%;
  background: #e8241c; border: 2px solid #3a0a06; border-radius: 3px; transform: rotate(45deg);
}
#titleMute::after { transform: rotate(-45deg); }

/* OH, RAWR! screen: the name field and SAVE SCORE sit over the canvas (see OVER_FORM). */
body.over #pad, body.hof #pad { display: none; }
#over { display: none; position: fixed; z-index: 3; flex-direction: column; justify-content: space-between; }
body.overname #over { display: flex; }
#overName {
  font: bold 16px monospace; line-height: 1; text-align: center; text-transform: uppercase; width: 100%;
  background: #120d08; color: #fff4d8; border: 2px solid #ffc21e; border-radius: 4px; padding: 0 4px;
  touch-action: auto; -webkit-user-select: text; user-select: text;
}
#overSave {
  font-family: monospace; font-weight: bold; line-height: 1; width: 100%; padding: 0; border: 2px solid #3a1a00; border-radius: 4px;
  background: #ffc21e; color: #3a1a00; touch-action: manipulation; cursor: pointer;
}
#overScore { display: none; }
body.typing #over {
  position: fixed; left: 50% !important; top: calc(6px + env(safe-area-inset-top)) !important; transform: translateX(-50%);
  width: min(70vw, 360px) !important; height: auto !important; gap: 6px; padding: 8px 10px;
  background: rgba(20,14,8,0.94); border: 2px solid #ffc21e; border-radius: 8px;
}
body.typing #overScore { display: block; font: bold 14px monospace; color: #ffc21e; text-align: center; }
body.typing #overName { height: 40px !important; font-size: 20px; }
body.typing #overSave { height: 34px !important; font-size: 15px !important; }
#overSave:disabled { background: #a08040; }

/* Portrait phones: ask to rotate (the game pauses underneath). */
#rotate {
  display: none; position: fixed; inset: 0; z-index: 9;
  background: rgba(0,10,40,0.94); color: #fff; font-family: monospace;
  flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
  touch-action: auto;
}
body.portrait.askrotate #rotate { display: flex; }
#rotate h2 { color: #ffd700; font-size: 20px; margin: 28px 0 10px; }
#rotate p { color: #ccc; font-size: 13px; max-width: 280px; }
#rotate .phone {
  width: 54px; height: 92px; border: 5px solid #88ff88; border-radius: 10px; position: relative;
  animation: turn 2.2s ease-in-out infinite;
}
#rotate .phone::after { content: '🦖'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
#rotateAnyway { margin-top: 26px; background: none; border: 1px solid #666; color: #aaa; font-family: monospace; font-size: 12px; padding: 8px 14px; touch-action: auto; }
/* "Get the app" card (install.js): phones on the title screen, every visit until installed. */
#install { display: none; }
body.pad.title #install.on {
  display: flex; align-items: center; gap: 10px;
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  top: calc(6px + env(safe-area-inset-top)); width: max-content; max-width: calc(100vw - 24px);
  padding: 7px 8px 7px 12px; border: 2px solid #ffc21e; border-radius: 10px;
  background: rgba(20,14,8,0.92); color: #fff4d8; font: 12px/1.3 monospace;
  box-shadow: 0 3px 0 rgba(0,0,0,0.45); touch-action: manipulation;
}
#install .dino { font-size: 22px; }
#install .txt b { color: #ffc21e; }
#install .ttl { font-weight: bold; font-size: 13px; color: #ffc21e; }
#install .share {
  display: inline-block; width: 10px; height: 12px; vertical-align: -2px; margin: 0 1px;
  border: 2px solid #4da3ff; border-top: none; border-radius: 0 0 2px 2px; position: relative;
}
#install .share::before { content: ''; position: absolute; left: 2px; top: -6px; width: 2px; height: 10px; background: #4da3ff; }
#install .share::after {
  content: ''; position: absolute; left: 0; top: -6px; width: 4px; height: 4px; margin-left: 0;
  border-left: 2px solid #4da3ff; border-top: 2px solid #4da3ff; transform: translateX(1px) rotate(45deg);
}
#installBtn {
  display: none; font: bold 13px monospace; padding: 8px 12px; border: 2px solid #3a1a00; border-radius: 6px;
  background: #ffc21e; color: #3a1a00; cursor: pointer; touch-action: manipulation;
}
#install.native #installBtn { display: block; }
#install.native #installHow { display: none; }
#installX {
  font: bold 16px monospace; width: 32px; height: 32px; flex: none; padding: 0;
  background: none; border: 1px solid #8a7040; border-radius: 6px; color: #fff4d8; cursor: pointer; touch-action: manipulation;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><img id="titleArt" src="assets/ui/title-screen.png" alt="T-Rex Run!: press start"><div id="titleMute"></div></div>

<div id="install" role="dialog" aria-label="Get the T-Rex Run app">
  <span class="dino">🦖</span>
  <div class="txt"><div class="ttl">GET THE T-REX RUN APP!</div><div id="installHow"></div></div>
  <button id="installBtn">INSTALL</button>
  <button id="installX" aria-label="Not now">&#10005;</button>
</div>

<div id="pad">
  <button id="bJump" class="pb jump" tabindex="-1"><img src="assets/ui/jump_64.png" alt=""><span>JUMP</span></button>
  <div class="right">
    <button id="bBite" class="pb bite" tabindex="-1"><img src="assets/ui/bite_64.png" alt=""><span>BITE</span></button>
    <button id="bRawr" class="pb rawr" tabindex="-1"><img src="assets/ui/rawr_64.png" alt=""><span>RAWR</span><small>hold = BIG</small></button>
  </div>
</div>

<div id="rotate">
  <div class="phone"></div>
  <h2>TURN YOUR PHONE SIDEWAYS</h2>
  <p>T-Rex Run plays best in landscape: you see more of the path ahead.</p>
  <button id="rotateAnyway">play upright anyway</button>
</div>

<div id="over"><div id="overScore"></div><input id="overName" type="text" maxlength="12" placeholder="YOUR NAME" autocomplete="off" autocapitalize="characters" enterkeyhint="done" aria-label="Your name for the Hall of Fame"><button id="overSave">SAVE SCORE</button></div>

<div id="nameBox">
  <div class="card">
    <h2>ENTER YOUR NAME</h2>
    <p>So you can compete on the leaderboard!</p>
    <input id="nameInput" type="text" maxlength="12" placeholder="Your name" autocomplete="off">
    <button id="nameBtn">LET'S GO! 🦖</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
<script type="module">
// Music scores (ChatGPT): one source of truth in docs/audio, exposed to the classic scripts.
import { THEMES } from './docs/audio/theme_scores.js';
window.THEME_SCORES = THEMES;
if (window.Sound) Sound.scoresReady();
</script>
<script src="audio.js"></script>
<script src="sprites.js"></script>
<script src="boss.js"></script>
<script src="encounters.js"></script>
<script src="game.js"></script>
<script src="install.js"></script>
</body>
</html>
