<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="T-Rex Run">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>T-Rex Run!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#nameBox {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,20,0.92);
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 10;
  touch-action: auto;
}
#nameBox .card {
  background: #0a0a2e;
  border: 2px solid #ffd700;
  padding: 28px 32px;
  text-align: center;
  font-family: monospace;
}
#nameBox h2 { color: #ffd700; font-size: 20px; margin-bottom: 6px; }
#nameBox p  { color: #aaa; font-size: 12px; margin-bottom: 18px; }
#nameInput {
  font-size: 18px; padding: 10px; width: 180px; text-align: center;
  background: #000; color: #fff; border: 2px solid #ffd700;
  font-family: monospace; display: block; margin: 0 auto 16px;
  touch-action: auto;
  -webkit-user-select: text; user-select: text;
}
#nameBtn {
  font-size: 14px; padding: 10px 28px;
  background: #ffd700; color: #000;
  border: none; font-family: monospace; font-weight: bold;
  cursor: pointer; touch-action: auto;
}

/* On-screen controls (touch devices only; see PAD in game.js) */
#pad { display: none; }
body.pad #pad { display: flex; }
body.portrait { flex-direction: column; justify-content: flex-start; }
body.portrait canvas { margin: auto 0; }
body.portrait #pad {
  flex: none; height: min(46vh, 340px); width: 100%; align-items: stretch; gap: 12px;
  padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
}
body.landscape #pad {
  position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
  justify-content: space-between; align-items: flex-end;
  padding: 0 calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
}
#pad .right { display: flex; gap: 12px; }
body.portrait #pad .right { flex: 1.2; flex-direction: column; }
.pb {
  font-family: monospace; font-weight: bold; color: #fff; letter-spacing: 1px;
  border: 3px solid rgba(255,255,255,0.85); border-radius: 18px;
  touch-action: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: auto; box-shadow: 0 4px 0 rgba(0,0,0,0.45);
  transition: transform 0.05s, filter 0.1s;
}
body.landscape .pb small { display: none; }
/* ChatGPT's pixel icons (assets/ui), drawn crisp; the text label stays under them. */
.pb img { image-rendering: pixelated; pointer-events: none; width: 48px; height: 48px; margin-bottom: 4px; }
body.landscape .pb img { width: 32px; height: 32px; margin-bottom: 0; }
.pb small { font-size: 10px; opacity: 0.8; font-weight: normal; margin-top: 2px; }
.pb.down { transform: translateY(3px) scale(0.97); box-shadow: 0 1px 0 rgba(0,0,0,0.45); filter: brightness(1.25); }
.pb.cool { filter: grayscale(0.8) brightness(0.6); }
.jump { background: #2f8de0; }
.bite { background: #e0442f; }
.rawr { background: #e08a1a; }
.rawr.big { background: #ffcf2a; color: #402000; }
.pb.pulse { animation: pulse 0.5s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.9); } to { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255,255,255,0); opacity: 1; } }
body.portrait .pb { font-size: 22px; flex: 1; }
body.portrait .jump { flex: 1; font-size: 26px; }
body.landscape .pb { opacity: 0.72; font-size: 15px; width: 17vmin; height: 17vmin; min-width: 64px; min-height: 64px; }
body.landscape .jump { width: 22vmin; height: 22vmin; min-width: 80px; min-height: 80px; font-size: 18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="pad">
  <button id="bJump" class="pb jump" tabindex="-1"><img src="assets/ui/jump_64.png" alt=""><span>JUMP</span></button>
  <div class="right">
    <button id="bBite" class="pb bite" tabindex="-1"><img src="assets/ui/bite_64.png" alt=""><span>BITE</span></button>
    <button id="bRawr" class="pb rawr" tabindex="-1"><img src="assets/ui/rawr_64.png" alt=""><span>RAWR</span><small>hold = BIG</small></button>
  </div>
</div>

<div id="nameBox">
  <div class="card">
    <h2>ENTER YOUR NAME</h2>
    <p>So you can compete on the leaderboard!</p>
    <input id="nameInput" type="text" maxlength="12" placeholder="Your name" autocomplete="off">
    <button id="nameBtn">LET'S GO! 🦖</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
<script type="module">
// Music scores (ChatGPT): one source of truth in docs/audio, exposed to the classic scripts.
import { THEMES } from './docs/audio/theme_scores.js';
window.THEME_SCORES = THEMES;
if (window.Sound) Sound.scoresReady();
</script>
<script src="audio.js"></script>
<script src="sprites.js"></script>
<script src="boss.js"></script>
<script src="encounters.js"></script>
<script src="game.js"></script>
</body>
</html>
